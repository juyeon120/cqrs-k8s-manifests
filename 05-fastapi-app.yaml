apiVersion: v1
kind: Service
metadata:
  name: fastapi-app-svc
  namespace: k8s-assign
spec:
  type: ClusterIP
  selector:
    app: fastapi-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: k8s-assign
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      automountServiceAccountToken: false
      # Must exceed the preStop sleep plus the time uvicorn needs to drain in-flight requests.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi-app
          # The application code is baked into this image by the CI pipeline; the tag is bumped by Jenkins.
          image: juyeon13241/fastapi-cqrs:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # 12-factor: all configuration comes from the environment.
          envFrom:
            - secretRef:
                name: cqrs-secret
          ports:
            - name: http
              containerPort: 8080
          # /healthz is dependency-free: a MongoDB/Kafka blip must not take every replica out of rotation.
          # The app only starts serving after MariaDB is connected (lifespan), so "ready" implies usable.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let endpoint removal propagate to kube-proxy/ingress before SIGTERM reaches uvicorn.
                command: ["sleep", "5"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fastapi-app-pdb
  namespace: k8s-assign
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fastapi-app
